stages:
  - check
  - test
  - coverage

check:
  stage: check
  tags:
    - ghrexplore_runner
  image: rnunesro/clim4health:latest
  cache: []
  variables:
    R_LIBS_SITE: /usr/local/lib/R/site-library
  script:
    - R CMD build .
    - R CMD check --as-cran --no-manual clim4health_*.tar.gz

unit-test:
  stage: test
  tags:
    - ghrexplore_runner
  image: rnunesro/clim4health:latest
  script:
    - R -e "remotes::install_local('.', dependencies = FALSE, upgrade = 'never')"
    - R -e "testthat::test_dir('tests')"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      # when: manual

coverage:
  stage: coverage
  tags:
    - ghrexplore_runner
  image: rnunesro/clim4health:latest
  script:
    - >
      R -e "
      cov <- covr::package_coverage();
      pct <- covr::percent_coverage(cov);
      cat('\nCoverage:', round(pct,2),'%\n');
      covr::to_cobertura(cov, 'coverage.xml')
      "
  coverage: '/Coverage:\s*([0-9]+(?:\.[0-9]+)?)\s*%/'
  #rules:
    #- if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
