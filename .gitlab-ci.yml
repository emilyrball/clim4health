stages:
  - check
  - test
  - coverage

check:
  stage: check
  tags:
    - ghrexplore_runner
  image: rnunesro/clim4health:latest
  cache: []
  variables:
    R_LIBS_SITE: /usr/local/lib/R/site-library
  script:
    - R CMD build .
    - R CMD check --no-manual clim4health_*.tar.gz

unit-test:
  stage: test
  tags:
    - ghrexplore_runner
  image: rnunesro/clim4health:latest
  script:
    - R -e "remotes::install_local('.', dependencies = FALSE, upgrade = 'never')"
    - R -e "testthat::test_dir('tests')"
  interruptible: true

coverage:
  stage: coverage
  tags:
    - ghrexplore_runner
  image: rnunesro/clim4health:latest
  dependencies:
    - unit-test # Wait for tests to pass
  script:
    - R -e "install.packages('DT')"
    - R -e "install.packages('htmltools')"
    - >
      R -e "
      cov <- covr::package_coverage();
      pct <- covr::percent_coverage(cov);
      cat('\nCoverage:', round(pct,2),'%\n');
      covr::report(cov, file = 'coverage-report/index.html')
      "
  when: on_success # Skip if tests fail
  coverage: '/Coverage:\s*([0-9]+(?:\.[0-9]+)?)\s*%/'
  artifacts:
    paths:
      - coverage-report/
